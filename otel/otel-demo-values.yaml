# =============================================================================
# otel-demo-values.yaml  —  OpenTelemetry Demo, routed to our ClickStack gateway
# =============================================================================
# The demo ships its own bundled collector. We add an OTLP/HTTP exporter that
# forwards the demo's traces/metrics/logs to our gateway, and disable the demo's
# bundled backends (Jaeger/Prometheus/Grafana/OpenSearch) — our gateway +
# ClickHouse Cloud are the backend.
#
# This is a TEMPLATE: ${OTEL_GATEWAY_ENDPOINT} is rendered with envsubst before
# install (see scripts/deploy-otel.sh). Do not helm install this file directly.
# =============================================================================

opentelemetry-collector:
  # Disable the demo collector's INFRASTRUCTURE receivers. Our cluster otel-agent
  # (host + kubelet metrics) and otel-cluster (k8s cluster metrics) already collect
  # these cluster-wide, so the demo collector doing it too both DOUBLE-COUNTS infra
  # metrics and floods logs with kubelet TLS scrape errors — its kubeletstats uses
  # endpoint ${env:K8S_NODE_IP}:10250 with no insecure_skip_verify, and kind's kubelet
  # serving cert has no IP SANs ("cannot validate certificate ... doesn't contain any
  # IP SANs"). Disabling the presets removes both the receivers and their pipeline
  # entries, leaving the demo collector to forward only APP telemetry (otlp, kafka,
  # spanmetrics, annotation-discovered metrics) to the gateway.
  presets:
    hostMetrics:
      enabled: false
    kubeletMetrics:
      enabled: false
    clusterMetrics:
      enabled: false

  # Our cluster otel-agent DaemonSet already binds these node hostPorts, so the
  # demo's collector can't claim them. The demo apps reach this collector via its
  # Service DNS, so we drop the hostPorts (keeping the Service/container ports).
  ports:
    otlp:
      hostPort: null
    otlp-http:
      hostPort: null
    jaeger-compact:
      hostPort: null
    jaeger-grpc:
      hostPort: null
    jaeger-thrift:
      hostPort: null
    zipkin:
      hostPort: null
  config:
    exporters:
      otlphttp/gateway:
        endpoint: "${OTEL_GATEWAY_ENDPOINT}"
        compression: gzip
    service:
      pipelines:
        traces:
          # keep spanmetrics (Helm replaces arrays, so we must re-list it)
          exporters: [spanmetrics, otlphttp/gateway]
        metrics:
          exporters: [otlphttp/gateway]
        logs:
          exporters: [otlphttp/gateway]

components:
  # Disable the optional flagd-ui sidecar (web UI for editing feature flags).
  # It OOMs at its 250Mi default and isn't needed; the flagd server still runs.
  flagd:
    sidecarContainers: []
    # Mount our delta-patched flag file instead of the chart's static flagd-config.
    # scripts/deploy-otel.sh builds the `flagd-config-scenarios` ConfigMap from the
    # SCENARIOS selection; mounting our own ConfigMap (rather than overwriting the
    # chart-managed flagd-config) avoids fighting Helm for field ownership. The init
    # container still copies /config-ro/demo.flagd.json, so the key name is unchanged.
    additionalVolumes:
      - name: config-ro
        configMap:
          name: flagd-config-scenarios

  # Disable the Playwright browser-traffic Locust user. In demo image 2.2.0 it crashes
  # on every task with AttributeError("'WebsiteBrowserUser' object has no attribute
  # 'tracer'") — an upstream locustfile bug: PlaywrightUser.__init__ shallow-copies the
  # user into sub_users (which actually run the tasks) BEFORE the demo subclass sets
  # self.tracer, so the copies never get it. It's not config-fixable in the image, adds
  # 100%-failing noise, and steals concurrency from the API user that reliably drives
  # the checkout/payment failures we want. envOverrides replaces just this one env var
  # by name (see otel-demo.envOverriden helper), leaving the rest of the default env.
  load-generator:
    envOverrides:
      - name: LOCUST_BROWSER_TRAFFIC_ENABLED
        value: "false"

# Keep the footprint light — our gateway + ClickHouse Cloud replace these.
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false
